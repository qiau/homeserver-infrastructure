services:
  cloudflared-multi:
    container_name: cloudflared-multi
    image: cloudflare/cloudflared:latest
    restart: unless-stopped

    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN_MULTI}
    networks:
      - prod-multi
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

networks:
  prod-multi:
    external: true
    name: prod-multi
